<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Fragments</title>

  <th:block th:fragment="style">
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" />
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link th:rel="stylesheet" th:href="@{/css/style.css}" />
  </th:block>

</head>

<body>

  <th:block th:fragment="navbar">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Asset Flow</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">

            <li class="nav-item">
              <a class=" nav-link active" aria-current="page" th:href="@{/}" th:if="${page == 'home'}">Home</a>
              <a class=" nav-link" aria-current="page" th:href="@{/}" th:unless="${page == 'home'}">Home</a>
            </li>

            <li class="nav-item">
              <a class=" nav-link active" aria-current="page" th:href="@{/dashboard}"
                th:if="${page == 'dashboard'}">Dashboard</a>
              <a class=" nav-link" aria-current="page" th:href="@{/dashboard}"
                th:unless="${page == 'dashboard'}">Dashboard</a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Factory
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" th:href="@{/buildings}">Building</a></li>
                <li><a class="dropdown-item" th:href="@{/departments}">Department</a></li>
                <li><a class="dropdown-item" th:href="@{/machines}">Machine</a></li>
              </ul>
            </li>
          </ul>
          <section class="px-2">
            <div class="btn btn-secondary" th:if="${page == 'buildings'}">
              <a class=" nav-link" th:href="@{/buildings/create}">Nuovo Fabbricato</a>
            </div>
            <div class="btn btn-secondary" th:if="${page == 'departments'}">
              <a class=" nav-link" th:href="@{/departments/create}">Nuovo Reparto</a>
            </div>
            <div class="btn btn-secondary" th:if="${page == 'machines'}">
              <a class=" nav-link" th:href="@{/machines/create}">Nuova macchina</a>
            </div>
          </section>
          <form class="d-flex" role="search" method="GET" th:action="@{/cerca}">
            <input class="form-control me-2" type="text" placeholder="Cerca" aria-label="Cerca" th:value="${value}"
              name="value" />
            <button class="btn btn-outline-success" type="submit">Cerca</button>
          </form>
        </div>
      </div>
    </nav>
  </th:block>


</body>

<th:block th:fragment="script">
  <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.min.js}"></script>
  <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</th:block>

</html>
