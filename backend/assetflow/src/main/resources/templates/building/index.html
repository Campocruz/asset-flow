<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title>Building page</title>
</head>

<body>

  <header>
    <div th:replace="~{ fragments/fragments :: navbar(page='buildings') }" />
  </header>

  <main>
    <div class="container">
      <div class="row">
        <div class="col">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Id</th>
                <th scope="col">Code</th>
                <th scope="col">Name</th>
                <th scope="col">Address</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="building : ${buildings}" th:object="${building}">
                <th scope="row">[[*{id}]]</th>
                <td>[[*{code}]]</td>
                <td>[[*{name}]]</td>
                <td>@[[*{address}]]</td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
