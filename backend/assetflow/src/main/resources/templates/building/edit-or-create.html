<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title th:unless="${typePage}">Create Building Page</title>
  <title th:if="${typePage}">Edit Building Page</title>
</head>

<body>

  <header>
    <div th:replace="~{ fragments/fragments :: navbar }" />
  </header>

  <main>
    <div class="container">
      <th:block>
        <div class="row mt-3">
          <h1 th:unless="${typePage}">Crea nuovo fabbricato</h1>
          <h1 th:if="${typePage}">Modifica "[[${building.name}]]"</h1>
        </div>
      </th:block>
      <section th:object="${building}">
        <form th:action="${typePage} ? @{|/buildings/edit/*{id}|} : @{/buildings/create}" method="post">
          <div class="row">

            <!-- <input type="hidden" th:field="*{pizza.id}"> -->

            <div class="col-12">
              <label for="code">Codice Fabbricato</label>
              <input id="code" type="text" class="form-control" th:field="*{code}" th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}">
                <ul>
                  <li th:each="error : ${#fields.errors('code')}" th:text="${error}" />
                </ul>
              </div>
            </div>

            <div class="col-12">
              <label for="name">Nome Fabbricato</label>
              <input id="name" type="text" class="form-control" th:field="*{name}" th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                <ul>
                  <li th:each="error : ${#fields.errors('name')}" th:text="${error}" />
                </ul>
              </div>
            </div>

            <div class="col-12">
              <label for="address">Indirizzo Fabbricato</label>
              <input id="address" type="text" class="form-control" th:field="*{address}" th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}">
                <ul>
                  <li th:each="error : ${#fields.errors('address')}" th:text="${error}" />
                </ul>
              </div>
            </div>

            <div class="col-12">
              <button th:unless="${typePage}" type="submit" class="btn btn-primary">Crea</button>
              <button th:if="${typePage}" type="submit" class="btn btn-primary">Modifica</button>
            </div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
