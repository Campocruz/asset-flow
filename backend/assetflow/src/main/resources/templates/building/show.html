<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title>Home Page</title>
</head>

<body>

  <header>
    <div th:replace="~{ fragments/fragments :: navbar(page='home') }" />
  </header>

  <main>
    <div class="container">
      <div class="row">
        <div class="col-6 mt-5">
          <h4>Dettagli:</h4>
          <div class="col-12" th:object="${building}">
            <ul>
              <li>ID: [[*{id}]]</li>
              <li>Asset-Code: [[*{code}]]</li>
              <li>Name: [[*{name}]]</li>
              <li>Status: [[*{address}]]</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
