<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title>Departments page</title>
</head>

<body>

  <header>
    <div th:replace="~{ fragments/fragments :: navbar(page='departments') }" />
  </header>

  <main>
    <div class="container">
      <div class="row">
        <div class="col">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Id</th>
                <th scope="col">Code</th>
                <th scope="col">Name</th>
                <th scope="col">Description</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="department : ${departments}" th:object="${department}">
                <th scope="row">[[*{id}]]</th>
                <td>[[*{code}]]</td>
                <td>[[*{name}]]</td>
                <td>[[*{description}]]</td>
                <td>
                  <form class="d-flex justify-content-around" method="post"
                    th:action="@{/departments/delete/{id}(id=*{id})}">
                    <a type="button" class="btn btn-secondary btn-sm" th:href="@{/departments/edit/{id}(id=*{id})}">
                      <i class="bi bi-pencil-square"></i>
                    </a>
                    <button class="btn btn-danger btn-sm" type="submit"><i class="bi bi-trash"></i></button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
