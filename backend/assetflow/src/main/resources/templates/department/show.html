<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title>Home Page</title>
</head>

<body>

  <header>
    <div th:replace="~{ fragments/fragments :: navbar(page='home') }" />
  </header>

  <main>
    <div class="container">
      <div class="row">
        <div class="col-6 mt-5">
          <h4>Dettagli:</h4>
          <div class="col-12" th:object="${department}">
            <ul>
              <li>ID: [[*{id}]]</li>
              <li>Asset-Code: [[*{code}]]</li>
              <li>Name: [[*{name}]]</li>
              <li>Status: [[*{description}]]</li>
            </ul>
            <h4>Fabbricato di appartenenza:</h4>
            <p>[[${building}]]</p>
          </div>
        </div>
        <div class="col-6 mt-5">
          <h4>Lista di macchine collegata</h4>
          <ul class="" th:if="${machines.size() > 0}">
            <li class="" th:each="machine : ${machines}" th:text="${machine.name}"></li>
          </ul>
          <p th:unless="${machines.size() > 0}">Non ancora associata una macchina</p>
        </div>
      </div>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
