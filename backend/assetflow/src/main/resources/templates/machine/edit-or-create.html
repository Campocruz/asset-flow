<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title th:unless="${typePage}">Create Machine Page</title>
  <title th:if="${typePage}">Edit Machine Page</title>
</head>

<body>

  <header>
    <div th:replace="~{ fragments/fragments :: navbar }" />
  </header>

  <main>
    <div class="container">
      <th:block>
        <div class="row mt-3">
          <h1 th:unless="${typePage}">Crea nuova macchina</h1>
          <h1 th:if="${typePage}">Modifica "[[${machine.name}]]"</h1>
        </div>
      </th:block>
      <section th:object="${machine}">
        <form th:action="${typePage} ? @{|/machines/edit/*{id}|} : @{/machines/create}" method="post">
          <div class="row">

            <!-- <input type="hidden" th:field="*{pizza.id}"> -->

            <div class="col-12">
              <label for="assetCode">Codice Asset</label>
              <input id="assetCode" type="text" class="form-control" th:field="*{assetCode}" th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('assetCode')}">
                <ul>
                  <li th:each="error : ${#fields.errors('assetCode')}" th:text="${error}" />
                </ul>
              </div>
            </div>

            <div class="col-12">
              <label for="name">Nome Macchina</label>
              <input id="name" type="text" class="form-control" th:field="*{name}" th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                <ul>
                  <li th:each="error : ${#fields.errors('name')}" th:text="${error}" />
                </ul>
              </div>
            </div>

            <div class="col-12">
              <label for="status">Stato Macchina</label>
              <input id="status" type="text" class="form-control" th:field="*{status}" th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}">
                <ul>
                  <li th:each="error : ${#fields.errors('status')}" th:text="${error}" />
                </ul>
              </div>
            </div>

            <!-- <div class="col-12">
              <label for="departments">Reparto</label>
              <input id="departments" type="text" class="form-control" th:field="*{departments}"
                th:errorClass="is-invalid">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('departments')}">
                <ul>
                  <li th:each="error : ${#fields.errors('departments')}" th:text="${error}" />
                </ul>
              </div>
            </div> -->
            <div class="col-12">
              <div class="form-check" th:each="department : *{departments}">
                <input class="form-check-input" type="checkbox" th:value="${department.id}" th:field="${department}"
                  th:id="|department-${department.id}|">
                <label class="form-check-label" th:for="|department-${department.id}|" th:text="${department.name}" />
              </div>
            </div>

            <div class="col-12">
              <button th:unless="${typePage}" type="submit" class="btn btn-primary">Crea</button>
              <button th:if="${typePage}" type="submit" class="btn btn-primary">Modifica</button>
            </div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
