<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <div th:insert="~{ fragments/fragments :: style }" />
  <title>Home Page</title>
</head>

<body>

  <header>
    <div th:replace="~{ fragments/fragments :: navbar(page='home') }" />
  </header>

  <main>
    <div class="container">
      <div class="row">
        <div class="col-6 mt-5">
          <h4>Dettagli:</h4>
          <div class="col-12" th:object="${machine}">
            <ul>
              <li>ID: [[*{id}]]</li>
              <li>Asset-Code: [[*{assetCode}]]</li>
              <li>Name: [[*{name}]]</li>
              <li>Status: [[*{status}]]</li>
            </ul>
          </div>
        </div>
        <div class="col-6 mt-5">
          <h4>Lista di Reparti collegata</h4>
          <ul class="" th:if="${departments.size() > 0}">
            <li class="" th:each="department : ${departments}" th:text="${department.name}"></li>
          </ul>
          <p th:unless="${departments.size() > 0}">Non ancora associata ad un reparto</p>
        </div>
      </div>
    </div>
  </main>

  <footer></footer>

</body>

<div th:insert="~{ fragments/fragments :: script }" />

</html>
